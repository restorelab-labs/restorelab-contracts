[package]
name = "restorelab-specimen"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = "=29.0.1"
[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
