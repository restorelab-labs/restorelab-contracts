name: Specimen lifetime tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: restorelab-labs/restorelab-contracts
          path: restorelab-contracts
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path restorelab-contracts/Cargo.toml
